<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" />
    <title>OrioKerg — управление сайтом</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        if (!window.CMS) return;

        /* ─── Стили превью ─── */
        if (typeof window.CMS.registerPreviewStyle === "function") {
          window.CMS.registerPreviewStyle(
            "@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');" +
            "body{font-family:Inter,system-ui,sans-serif;color:#2e2620;background:#f7f1e7;padding:28px;line-height:1.7;}" +
            "h1,h2,h3,h4{font-family:'Cormorant Garamond',Georgia,serif;color:#2e2620;font-weight:600;}" +
            "h1{font-size:2.6rem;margin:0 0 .4em;} h2{font-size:2rem;}" +
            "a{color:#9a6b3f;} img{max-width:100%;border-radius:16px;}",
            { raw: true }
          );
        }

        /* ─── Превью карточки животного ─── */
        if (typeof window.CMS.registerPreviewTemplate !== "function") return;

        var h = window.h;
        var createClass = window.createClass;

        var AnimalCardPreview = createClass({
          render: function () {
            var entry = this.props.entry;
            var getAsset = this.props.getAsset;

            var name = entry.getIn(["data", "name"]) || "Имя не указано";
            var photos = entry.getIn(["data", "photos"]);
            var firstPhoto = null;

            if (photos && photos.size > 0) {
              var raw = photos.get(0);
              // Фото в list-виджете может прийти как Map {photo: путь} — разворачиваем.
              if (raw && typeof raw.get === "function") raw = raw.get("photo");
              // ВАЖНО: передаём объект getAsset НАПРЯМУЮ (не .toString()).
              // Decap сам подставит blob-URL только что загруженного файла и
              // перерисует превью, когда asset подгрузится. Прежний .toString()
              // с откатом на боевой /images/uploads/... показывал битую картинку
              // до деплоя (файла там ещё нет).
              try { firstPhoto = raw ? getAsset(raw) : null; } catch (e) { firstPhoto = null; }
            }

            var styles = {
              wrap: {
                fontFamily: "Inter, system-ui, sans-serif",
                background: "#f7f1e7",
                minHeight: "100vh",
                padding: "24px",
                color: "#2e2620",
              },
              title: {
                fontFamily: "'Cormorant Garamond', Georgia, serif",
                fontSize: "1.8rem",
                fontWeight: 600,
                marginBottom: "20px",
              },
              grid: {
                display: "grid",
                gridTemplateColumns: "1fr 1fr",
                gap: "20px",
                marginBottom: "24px",
              },
              label: {
                fontSize: "12px",
                color: "#888",
                marginBottom: "8px",
                fontWeight: 500,
              },
              squareWrap: {
                width: "100%",
                paddingBottom: "100%",
                position: "relative",
                overflow: "hidden",
                borderRadius: "20px",
                background: "#e8e0d0",
                border: "1px solid #d4c9b6",
                boxShadow: "0 2px 12px rgba(0,0,0,0.08)",
              },
              squareImg: {
                position: "absolute",
                top: 0, left: 0,
                width: "100%",
                height: "100%",
                objectFit: "cover",
              },
              squarePlaceholder: {
                position: "absolute",
                top: "50%", left: "50%",
                transform: "translate(-50%, -50%)",
                textAlign: "center",
                color: "#b8a898",
                fontSize: "13px",
              },
              fullImg: {
                width: "100%",
                borderRadius: "16px",
                display: "block",
                boxShadow: "0 2px 12px rgba(0,0,0,0.08)",
              },
              hint: {
                background: "#fff8ee",
                border: "1px solid #e6c97a",
                borderRadius: "12px",
                padding: "12px 16px",
                fontSize: "13px",
                color: "#7a5c2e",
                marginTop: "4px",
              },
              meta: {
                marginTop: "20px",
                padding: "16px",
                background: "rgba(255,255,255,0.6)",
                borderRadius: "16px",
                border: "1px solid #e0d8ce",
                fontSize: "14px",
                lineHeight: 1.8,
              },
            };

            var gender = entry.getIn(["data", "gender"]) || "";
            var color = entry.getIn(["data", "color"]) || "";
            var pricePet = entry.getIn(["data", "price_pet"]);
            var priceBreed = entry.getIn(["data", "price_breed"]);
            var reserved = entry.getIn(["data", "reserved"]);
            var birth = entry.getIn(["data", "birth_date"]);
            var mother = entry.getIn(["data", "mother"]) || "";
            var father = entry.getIn(["data", "father"]) || "";
            var description = entry.getIn(["data", "description"]) || "";

            // Возраст + дата рождения (живой расчёт от сегодняшней даты)
            var ageText = "", birthText = "";
            if (birth) {
              var bd = new Date(birth);
              if (!isNaN(bd.getTime())) {
                birthText = bd.toLocaleDateString("ru-RU", { day: "numeric", month: "long", year: "numeric" });
                var days = Math.floor((Date.now() - bd.getTime()) / 86400000);
                var plural = function (n, f) {
                  var a = Math.abs(n) % 100, t = a % 10;
                  if (a > 10 && a < 20) return f[2];
                  if (t > 1 && t < 5) return f[1];
                  if (t === 1) return f[0];
                  return f[2];
                };
                if (days < 0) ageText = "";
                else if (days < 14) { var d = Math.max(days, 1); ageText = d + " " + plural(d, ["день", "дня", "дней"]); }
                else if (days < 60) { var w = Math.round(days / 7); ageText = w + " " + plural(w, ["неделя", "недели", "недель"]); }
                else { var m = Math.floor(days / 30.44); ageText = m + " " + plural(m, ["месяц", "месяца", "месяцев"]); }
              }
            }

            return h("div", { style: styles.wrap },
              h("p", { style: styles.title }, "Превью карточки: " + name),

              h("div", { style: styles.grid },
                // — Квадратный кроп (как на карточке)
                h("div", {},
                  h("p", { style: styles.label }, "📐 Как на карточке (1:1 crop, object-cover)"),
                  h("div", { style: styles.squareWrap },
                    firstPhoto
                      ? h("img", { src: firstPhoto, style: styles.squareImg, alt: name })
                      : h("div", { style: styles.squarePlaceholder }, h("div", {}, "🐱"), h("div", {}, "Фото не добавлено"))
                  ),
                  h("p", { style: styles.hint },
                    "💡 Кот виден ровно так, как на сайте. Если уши или лапы обрезаны — разместите кота ближе к центру фото."
                  )
                ),

                // — Оригинал
                h("div", {},
                  h("p", { style: styles.label }, "🖼 Исходное фото"),
                  firstPhoto
                    ? h("img", { src: firstPhoto, style: styles.fullImg, alt: name })
                    : h("p", { style: { color: "#b8a898", fontSize: "13px" } }, "Фото не загружено")
                )
              ),

              // — Мета-инфо
              h("div", { style: styles.meta },
                gender ? h("div", {}, h("b", {}, "Пол: "), gender) : null,
                color ? h("div", {}, h("b", {}, "Окрас: "), color) : null,
                ageText ? h("div", {}, h("b", {}, "Возраст: "), ageText) : null,
                birthText ? h("div", {}, h("b", {}, "Дата рождения: "), birthText) : null,
                mother ? h("div", {}, h("b", {}, "Мама: "), mother) : null,
                father ? h("div", {}, h("b", {}, "Папа: "), father) : null,
                pricePet ? h("div", {}, h("b", {}, "Цена в любимцы: "), pricePet.toLocaleString("ru-RU") + " ₽") : null,
                priceBreed ? h("div", {}, h("b", {}, "Цена в разведение: "), priceBreed.toLocaleString("ru-RU") + " ₽") : null,
                reserved !== undefined ? h("div", {}, h("b", {}, "Статус: "), reserved ? "🔴 Зарезервирован" : "🟢 Доступен") : null,
                description ? h("div", { style: { marginTop: "10px", paddingTop: "10px", borderTop: "1px solid #e0d8ce", color: "#6b5d4f" } }, description) : null
              )
            );
          },
        });

        window.CMS.registerPreviewTemplate("kittens", AnimalCardPreview);
        window.CMS.registerPreviewTemplate("cats", AnimalCardPreview);
      })();
    </script>
  </body>
</html>
