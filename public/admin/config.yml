backend:
  name: git-gateway
  repo: TheVeryGit/oriokerg
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/cf4c374d-f26f-4302-82b4-9b07ac3b4b50/pkce
  auth_token_endpoint: /sites/cf4c374d-f26f-4302-82b4-9b07ac3b4b50/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

locale: ru

# Черновики: запись проходит «Черновик → Готово к публикации → Опубликовано».
# Можно сохранить недописанное и вернуться позже; удаляется кнопкой в колонке.
publish_mode: editorial_workflow

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://oriokerg.ru
display_url: https://oriokerg.ru

media_folder: public/images/uploads
public_folder: /images/uploads

slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: kittens
    label: Котята в продаже
    label_singular: Котёнка
    description: Малыши, доступные для продажи. Появляются на странице «Котята».
    folder: content/kittens
    create: true
    identifier_field: name
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{name}} — {{color}}"
    sortable_fields: [name, price_pet]
    preview_path: kittens
    view_filters:
      - { label: Свободные, field: reserved, pattern: false }
      - { label: Зарезервированные, field: reserved, pattern: true }
    fields:
      - { label: Имя, name: name, widget: string, hint: "Кличка котёнка" }
      - label: Пол
        name: gender
        widget: select
        default: Кошка
        options: [Кот, Кошка]
      - { label: Окрас, name: color, widget: string, hint: "Например: красный тикированный" }
      - label: "Тип (телосложение)"
        name: body_type
        widget: select
        required: false
        options: [Классический, Современный, Экстремальный]
        hint: "Тип ориентала: классический мягче, современный стройнее, экстремальный максимально утончённый. Можно не указывать."
      - { label: "Цена в любимцы (₽)", name: price_pet, widget: number, required: false, hint: "Стоимость котёнка как домашнего любимца (пет-класс). Можно не указывать." }
      - { label: "Цена в разведение (₽)", name: price_breed, widget: number, required: false, hint: "Стоимость с правом разведения. Оставьте пустым, если не продаётся в разведение." }
      - label: Дата рождения
        name: birth_date
        widget: datetime
        required: false
        date_format: "DD.MM.YYYY"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
        hint: "Возраст («2 месяца») посчитается на сайте автоматически. Можно не указывать."
      - { label: "Мама (кличка)", name: mother, widget: string, required: false, hint: "Кличка матери — покажется в характеристиках. Необязательно." }
      - { label: "Папа (кличка)", name: father, widget: string, required: false, hint: "Кличка отца — покажется в характеристиках. Необязательно." }
      - { label: Описание, name: description, widget: text, required: false, hint: "Пара тёплых предложений о малыше: характер, привычки, чем выделяется." }
      - label: Фотографии
        name: photos
        widget: list
        required: false
        label_singular: Фото
        summary: "Фото {{index}}"
        hint: "Первое фото — обложка карточки (показывается квадратом). Проверьте обрезку в панели «Просмотр» справа — кот должен помещаться целиком. Перетаскивайте фото, чтобы поменять порядок."
        field: { label: Фото, name: photo, widget: image }
      - { label: Зарезервирован, name: reserved, widget: boolean, default: false, hint: "Включите, если котёнок уже забронирован — на карточке появится отметка." }

  - name: cats
    label: Кошки и производители
    label_singular: Кошку
    description: Мамы и папы наших помётов. Показываются на странице «Наши кошки».
    folder: content/cats
    create: true
    identifier_field: name
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    summary: "{{name}} — {{color}}"
    sortable_fields: [name, price]
    preview_path: "cats/{{slug}}"
    view_filters:
      - { label: Доступные, field: available, pattern: true }
    fields:
      - { label: Имя, name: name, widget: string, hint: "Кличка животного" }
      - label: Пол
        name: gender
        widget: select
        default: Кошка
        options: [Кот, Кошка]
      - { label: Окрас, name: color, widget: string, hint: "Например: красный тикированный" }
      - label: "Тип (телосложение)"
        name: body_type
        widget: select
        required: false
        options: [Классический, Современный, Экстремальный]
        hint: "Тип ориентала: классический мягче, современный стройнее, экстремальный максимально утончённый. Можно не указывать."
      - { label: Цена, name: price, widget: number, required: false, hint: "В рублях. Можно не указывать." }
      - { label: Описание, name: description, widget: text, required: false }
      - label: Фотографии
        name: photos
        widget: list
        required: false
        label_singular: Фото
        summary: "Фото {{index}}"
        hint: "Первое фото — обложка карточки (квадрат). Проверьте обрезку в панели «Просмотр» справа. Перетаскиванием меняется порядок."
        field: { label: Фото, name: photo, widget: image }
      - { label: Доступен, name: available, widget: boolean, default: true }

  - name: settings
    label: Настройки сайта
    description: Общие тексты, контакты и содержимое статичных страниц.
    files:
      - label: Контакты и общее
        name: contacts
        file: content/settings/contacts.md
        description: Телефон и мессенджеры — используются на кнопках по всему сайту.
        fields:
          - name: phone
            label: Телефон
            widget: string
            hint: "Например: +7 900 000 00 00"
            pattern: ["^[+0-9 ()\\-]{6,}$", "Только цифры, пробелы и + ( ) — например +7 900 000 00 00"]
          - name: telegram
            label: "Telegram (ссылка)"
            widget: string
            hint: "Полная ссылка, например https://t.me/oriokerg"
            pattern: ["^https?://(t\\.me|telegram\\.me)/.+", "Ссылка должна начинаться с https://t.me/"]
          - name: vk
            label: "ВКонтакте (ссылка)"
            widget: string
            hint: "Полная ссылка, например https://vk.com/oriokerg"
            pattern: ["^https?://(vk\\.com|vk\\.ru)/.+", "Ссылка должна начинаться с https://vk.com/"]
          - { name: address, label: "Адрес (необязательно)", widget: string, required: false }
          - name: email
            label: "E-mail для обращений"
            widget: string
            required: false
            hint: "Нужен для политики конфиденциальности — сюда пишут по вопросам перс. данных. Например: info@oriokerg.ru"
            pattern: ["^$|^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$", "Введите корректный e-mail или оставьте пустым"]
          - name: operator
            label: "Оператор данных (для политики конфиденциальности)"
            widget: string
            required: false
            hint: "ФИО указывать НЕ обязательно. Можно оставить пустым (будет «Администрация сайта OrioKerg») или вписать обезличенно: «Питомник OrioKerg». ИП/самозанятый — по желанию."
      - label: Главная страница
        name: homepage
        file: content/settings/homepage.md
        description: Все тексты и блоки главной страницы.
        fields:
          - { name: hero_title, label: "Заголовок (первый экран)", widget: string, hint: "Слово в звёздочках подсветится золотом, напр.: с *характером*" }
          - { name: hero_subtitle, label: "Подзаголовок (первый экран)", widget: text }
          - { name: hero_image, label: "Фото на первом экране", widget: image, required: false, hint: "Если пусто — используется фото по умолчанию" }
          - { name: intro_text, label: "Вступительный текст", widget: text, required: false }
          - label: "Цифры (статистика)"
            name: stats
            widget: list
            required: false
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            hint: "Блок с цифрами под первым экраном. Если пусто — показываются значения по умолчанию."
            fields:
              - { name: value, label: Значение, widget: string, hint: "Например: 8, 120, WCF, 4.9" }
              - { name: suffix, label: Приставка, widget: string, required: false, hint: "Например: + или « лет» (с пробелом). Можно оставить пустым." }
              - { name: label, label: Подпись, widget: string }
          - { name: breed_title, label: "Заголовок блока о породе", widget: string, required: false, hint: "Последнее слово подсветится золотом (напр. «Ориентальная кошка»)." }
          - { name: breed_text, label: "Текст блока о породе", widget: text, required: false }
          - label: "Качества породы (короткий блок на главной)"
            name: breed_traits
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text }
          - { name: steps_title, label: "Заголовок блока «Как забрать котёнка»", widget: string, required: false }
          - label: "Шаги «Как забрать котёнка»"
            name: steps
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "Номера 01, 02, 03… проставляются автоматически."
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text }
          - { name: reviews_title, label: "Заголовок блока отзывов", widget: string, required: false }
          - label: Отзывы
            name: reviews
            widget: list
            required: false
            summary: "{{fields.name}} — {{fields.city}}"
            fields:
              - { name: name, label: Имя, widget: string }
              - { name: city, label: Город, widget: string, required: false }
              - { name: text, label: Текст отзыва, widget: text }
          - { name: cta_title, label: "Заголовок призыва (внизу страницы)", widget: string, required: false }
          - { name: cta_text, label: "Текст призыва", widget: text, required: false }
      - label: Страница «Порода»
        name: breed
        file: content/settings/breed.md
        description: Тексты и блоки страницы о породе ориентал.
        fields:
          - { name: title, label: Заголовок, widget: string }
          - { name: intro_text, label: Вступительный текст, widget: text }
          - { name: hero_image, label: Фото, widget: image, required: false, hint: "Если пусто — фото по умолчанию" }
          - { name: traits_title, label: "Заголовок блока «Характер и внешность»", widget: string, required: false }
          - label: "Качества породы (карточки)"
            name: traits
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text }
          - { name: care_title, label: "Заголовок блока «Уход»", widget: string, required: false }
          - label: "Блок «Уход»"
            name: care
            widget: list
            required: false
            summary: "{{fields.title}}"
            hint: "Номера проставляются автоматически."
            fields:
              - { name: title, label: Заголовок, widget: string }
              - { name: text, label: Текст, widget: text }
          - { name: cta_title, label: "Заголовок призыва", widget: string, required: false }
          - { name: cta_text, label: "Текст призыва", widget: text, required: false }
      - label: О питомнике
        name: about
        file: content/settings/about.md
        description: Заголовок, текст и фото страницы «О питомнике».
        fields:
          - { name: title, label: Заголовок, widget: string }
          - { name: body, label: "Текст страницы", widget: markdown }
          - { name: photo, label: Фото, widget: image, required: false }
      - label: Частые вопросы (FAQ)
        name: faq
        file: content/settings/faq.md
        description: Вопросы и ответы на странице FAQ.
        fields:
          - { name: title, label: Заголовок, widget: string }
          - { name: intro, label: Вступительный текст, widget: text, required: false }
          - label: Вопросы
            name: items
            widget: list
            summary: "[{{fields.category}}] {{fields.q}}"
            fields:
              - { name: q, label: Вопрос, widget: string }
              - { name: a, label: Ответ, widget: text }
              - label: Категория
                name: category
                widget: select
                required: false
                default: Общее
                options:
                  - Бронь и оплата
                  - Документы и гарантии
                  - Уход и здоровье
                  - Доставка
                  - Общее
                hint: "Группирует вопросы на странице по темам. Можно оставить «Общее»."
